name: Update README Assets

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Generate Contribution Grid Snake with Portfolio Palette
        uses: Platane/snk@v3.2.0
        with:
          github_user_name: paranthaman21
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23e91e8c&color_dots=%23eee0c8,%23e3d0b2,%23f97316,%23e91e8c,%23b5156d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23e91e8c&color_dots=%23161b22,%233d2b1f,%23f97316,%23e91e8c,%23ff2a9d

      - name: Deploy Dynamic SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

